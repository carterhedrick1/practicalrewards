<!DOCTYPE html>
<!-- Pipeline template: generate a finished post from this file; do not deploy it as a page. -->
<html lang="en">
<head>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-TXPB5KSTNP"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-TXPB5KSTNP');
    </script>
    <!-- Microsoft Clarity -->
    <script type="text/javascript">
        (function(c,l,a,r,i,t,y){
            c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};
            t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i;
            y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);
        })(window, document, "clarity", "script", "t8qvj4h0gj");
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#f5f5f4">
    <link rel="stylesheet" href="/css/critical-header.css">
    <title>{{TITLE}} | Practical Rewards</title>
    <meta name="description" content="{{META_DESCRIPTION}}">
    <link rel="canonical" href="{{CANONICAL_URL}}">

    <!-- Open Graph / Social Media -->
    <meta property="og:type" content="article">
    <meta property="og:url" content="{{CANONICAL_URL}}">
    <meta property="og:title" content="{{TITLE}} | Practical Rewards">
    <meta property="og:description" content="{{META_DESCRIPTION}}">
    <meta property="og:site_name" content="Practical Rewards">
    <meta property="article:published_time" content="{{DATE_PUBLISHED}}">
    <meta property="article:modified_time" content="{{DATE_MODIFIED}}">

    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicons/favicon-16x16.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicons/favicon-32x32.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/favicons/apple-touch-icon.png">
    <link rel="manifest" href="/favicons/site.webmanifest">

    <link rel="stylesheet" href="/css/styles.css?v=2.0">
    <link rel="stylesheet" href="/css/blog.css">
    <style>
        .article-shell {
            margin: 0 auto;
            max-width: 65ch;
            padding: clamp(3rem, 8vw, 5rem) 1rem;
            width: 100%;
        }

        .article-header {
            border-bottom: 1px solid #d6d3d1;
            margin-bottom: 2.5rem;
            padding-bottom: 2rem;
        }

        .article-header h1 {
            color: #1c1917;
            font-size: clamp(2.25rem, 7vw, 3.75rem);
            line-height: 1.1;
            margin-bottom: 1.25rem;
        }

        .article-meta {
            color: #57534e;
            font-size: 0.95rem;
            margin-top: 0.4rem;
        }

        .article-meta a,
        .article-content a {
            color: #047857;
            font-weight: 600;
            text-underline-offset: 0.16em;
        }

        .article-content > * + * {
            margin-top: 1.25rem;
        }

        .article-content h2 {
            color: #1c1917;
            font-size: clamp(1.65rem, 4vw, 2rem);
            line-height: 1.25;
            margin-top: 2.75rem;
        }

        .article-content h3 {
            color: #292524;
            font-size: clamp(1.3rem, 3vw, 1.55rem);
            line-height: 1.3;
            margin-top: 2.25rem;
        }

        .article-content ul,
        .article-content ol {
            padding-left: 1.5rem;
        }

        .article-content li + li {
            margin-top: 0.5rem;
        }

        .article-content table {
            background: #ffffff;
            border-collapse: collapse;
            display: block;
            font-size: 0.95rem;
            max-width: 100%;
            overflow-x: auto;
            width: max-content;
        }

        .article-content th,
        .article-content td {
            border: 1px solid #d6d3d1;
            padding: 0.75rem;
            text-align: left;
            vertical-align: top;
        }

        .article-content th {
            background: #f0fdf4;
            color: #14532d;
            font-weight: 700;
        }

        @media (min-width: 1024px) {
            .article-shell {
                max-width: 760px;
            }

            .article-content table {
                width: 100%;
            }
        }
    </style>
    <script type="application/ld+json">{{JSON_LD}}</script>
</head>
<body>
    <div id="header-placeholder">
        <div class="loading-placeholder">Loading navigation...</div>
    </div>

    <main>
        <article class="article-shell">
            {{HERO}}
            <div class="article-header">
                <h1>{{TITLE}}</h1>
                <p class="article-meta">Published <time datetime="{{DATE_PUBLISHED}}">{{DATE_DISPLAY}}</time></p>
                <p class="article-meta">By <a href="/about.html">Carter</a></p>
            </div>

            <div class="article-content">
                {{CONTENT}}
            </div>
        </article>
    </main>

    <div id="footer-placeholder">
        <div class="loading-placeholder">Loading footer...</div>
    </div>

    <script src="/js/header.js"></script>
</body>
</html>
